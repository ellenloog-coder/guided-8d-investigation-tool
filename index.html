function cleanPhrase(x){return String(x||'').replace(/\s+/g,' ').replace(/[，,。.;；]+$/,'').trim();}
function inferChineseProduct(raw){let f=state.fields; if(cleanPhrase(f.product))return cleanPhrase(f.product); let m=raw.match(/(帐篷|枕头|主板|连接器|注塑件|密封件|包装|产品|零件)/); return m?m[1]:'相关产品';}
function inferChineseFailure(raw){let f=state.fields; if(cleanPhrase(f.failureMode))return cleanPhrase(f.failureMode); let patterns=['连接管断裂','连接件断裂','断针','焊桥','飞边','泄漏','误判','断裂','完全失效','失效','开裂','变形']; for(const p of patterns){if(raw.includes(p))return p;} return '质量异常';}
function optimizeD2Language(){
 syncFromDom();
 let f=state.fields;
 let raw=cleanPhrase(f.d2)||cleanPhrase(f.problemRaw);
 if(!raw){alert(state.lang==='zh'?'请先输入一些问题描述，再优化语言。':'Please enter a problem description first.');return;}
 if(state.lang==='zh'){
   const product=inferChineseProduct(raw);
   const failure=inferChineseFailure(raw);
   const source=cleanPhrase(f.source);
   const phase=cleanPhrase(f.phase);
   const qty=cleanPhrase(f.qty);
   const scope=cleanPhrase(f.scopeKnown);
   const whereBits=[];
   if(raw.includes('消费者')||raw.includes('客户')) whereBits.push('消费者/客户使用场景');
   if(raw.includes('使用')) whereBits.push('使用过程中');
   if(raw.includes('在售')) whereBits.push('在售品');
   if(raw.includes('库存')) whereBits.push('库存品');
   let context=whereBits.length?whereBits.join('、'):'发现阶段和具体场景待确认';
   let impact = raw.includes('完全失效') ? '导致产品功能完全失效' : '可能影响产品功能、客户体验或后续出货判断';
   let lines=[];
   lines.push(`根据现有输入，${product}发生${failure}，${impact}。`);
   if(source||phase) lines.push(`问题来源/阶段：${[source,phase].filter(Boolean).join(' / ')}。`);
   lines.push(`已知场景/范围：${context}。`);
   lines.push(`当前影响数量/比例：${qty||missing()}。`);
   lines.push(`当前可追溯范围：${scope||missing()}。`);
   lines.push(`原始输入：${raw}。`);
   lines.push('下一步需要通过退货/投诉数据、库存清单、批次记录和样品确认来界定影响范围，并避免在 D2 阶段提前下根因结论。');
   state.fields.d2=lines.join('\n');
 } else {
   const product=cleanPhrase(f.product)||missing();
   const failure=cleanPhrase(f.failureMode)||missing();
   const source=cleanPhrase(f.source);
   const phase=cleanPhrase(f.phase);
   const qty=cleanPhrase(f.qty);
   const scope=cleanPhrase(f.scopeKnown);
   const context=[];
   if(/customer|consumer/i.test(raw)) context.push('customer/consumer use');
   if(/sale|selling/i.test(raw)) context.push('sellable inventory');
   if(/stock|inventory/i.test(raw)) context.push('warehouse inventory');
   const lines=[];
   lines.push(`Based on the current input, ${product} shows ${failure}.`);
   if(source||phase) lines.push(`Source / phase: ${[source,phase].filter(Boolean).join(' / ')}.`);
   lines.push(`Known scenario / scope: ${context.length?context.join(', '):missing()}.`);
   lines.push(`Affected quantity / rate: ${qty||missing()}.`);
   lines.push(`Current traceability: ${scope||missing()}.`);
   lines.push(`Original input: ${raw}.`);
   lines.push('Next step: verify the affected scope using return/complaint data, inventory records, batch traceability, and sample confirmation. Do not conclude root cause in D2.');
   state.fields.d2=lines.join('\n');
 }
 renderStandaloneFields();
 updateAll();
}

function runIntegritySelfTests(){
 const original=clone(state);
 const results=[];
 const test=(name,fn)=>{try{results.push({name,pass:!!fn()});}catch(error){results.push({name,pass:false,error:String(error&&error.message||error)});}};
 try{
  state=makeSelfTestState();
  ensureV31State();
  test('v31 schema initialized',()=>state.schemaVersion===31&&state.integrity&&state.meta);
  test('stable ID increments by type',()=>{const id=nextStableId('evidence');return /^E-\d{3}$/.test(id)&&state.meta.idCounters.evidence>=10});

  test('valid evidence passes',()=>validateEvidenceRecord(getObjectById('Evidence','E-001')).status==='pass');
  test('evidence without link blocks',()=>{const s=clone(state);s.integrity.evidence[0].links=[];return validateEvidenceRecord(s.integrity.evidence[0],s).status==='blocked'});
  test('evidence dangling link blocks',()=>{const s=clone(state);s.integrity.evidence[0].links[0].relatedId='MISSING';return validateEvidenceRecord(s.integrity.evidence[0],s).status==='blocked'});
  test('coverage unknown blocks containment',()=>{const s=clone(state);s.integrity.containmentCoverage[0].applicability='Unknown';return validateContainmentIntegrity(s).status==='blocked'});
  test('detection not verified blocks containment',()=>{const s=clone(state);s.integrity.detectionReliability[0].measurementSystemStatus='Unknown';return validateContainmentIntegrity(s).status==='blocked'});
  test('confirmed root cause needs evidence',()=>{const s=clone(state);s.integrity.evidence=s.integrity.evidence.filter(e=>!((e.links||[]).some(l=>l.relatedType==='Root Cause'&&l.relatedId==='RC-001')));return validateRootCauseRecord(getObjectById('Root Cause','RC-001',s),s).status==='blocked'});
  test('missing occurrence root cause blocks D4',()=>{const s=clone(state);s.integrity.rootCauses=s.integrity.rootCauses.filter(r=>r.type!=='Occurrence');return validateRootCauseIntegrity(s).status==='blocked'});
  test('action without root cause blocks',()=>{const s=clone(state);s.integrity.correctiveActions[0].rootCauseIds=[];return validateCorrectiveAction(s.integrity.correctiveActions[0],s).status==='blocked'});
  test('weak human-only action blocks',()=>{const s=clone(state);s.integrity.correctiveActions=s.integrity.correctiveActions.filter(a=>!(a.rootCauseIds||[]).includes('RC-001')); const a=clone(state.integrity.correctiveActions[0]); a.id='CA-T01'; a.rootCauseIds=['RC-001']; a.actionType='Training'; a.dependencyOnHuman='High'; s.integrity.correctiveActions.push(a); return validateActionIntegrity(s).status==='blocked'});
  test('confirmed root cause without action blocks',()=>{const s=clone(state);s.integrity.correctiveActions=s.integrity.correctiveActions.filter(a=>!(a.rootCauseIds||[]).includes('RC-001'));return validateActionIntegrity(s).status==='blocked'});
  test('implemented action without verification is pending',()=>{const s=clone(state);s.integrity.verifications=[];return computeActionStatus(s.integrity.correctiveActions[0],s)==='Verification Pending'});
  test('latest failed verification fails action',()=>{const s=clone(state);const v=clone(s.integrity.verifications[0]);v.id='V-099';v.verificationDate='2099-01-01';v.assessment='Fail';v.recurrenceFound='Yes';s.integrity.verifications.push(v);return computeActionStatus(s.integrity.correctiveActions[0],s)==='Failed'});
  test('passing verification verifies action',()=>computeActionStatus(state.integrity.correctiveActions[0],state)==='Verified');
  test('verification before implementation blocks',()=>{const s=clone(state);s.integrity.verifications[0].verificationDate='2000-01-01';return validateVerificationRecord(s.integrity.verifications[0],s).issues.some(i=>i.code==='V_DATE')});
  test('gate blocks when action integrity broken',()=>{const s=clone(state);s.integrity.correctiveActions[0].rootCauseIds=[];return buildGateResult(s).finalStatus==='Blocked'});
  test('external submission incomplete allows internal closure',()=>{const s=clone(state);s.externalSubmission.reviewed=false;return buildGateResult(s).finalStatus==='Ready for Internal Closure'});
  test('legacy state migrates to v31 draft records',()=>{const migrated=migrateStateToV31({lang:'en',fields:{d4text:'Occurrence root cause: Draft'},tables:{evidence:[['L1','Photo','Line','D4','High']],contain:[['WIP','Hold','QA','Photo','Release']],actions:[['D5','Fix','Owner','Metric','2026-07-13','Open']]}});return migrated.schemaVersion===31&&migrated.integrity.evidence.length&&migrated.integrity.rootCauses.length&&migrated.integrity.correctiveActions.length});
  test('D2 quick evidence writes integrity only',()=>{const s=clone(state);const saved=state;state=s;const beforeT=state.tables.evidence.length,beforeI=state.integrity.evidence.length; addEvidenceForStep('D2'); const ok=state.integrity.evidence.length===beforeI+1&&state.tables.evidence.length<=beforeT; state=saved; return ok});
  test('integrity attachment id links to evidence',()=>{const s=clone(state);const e=s.integrity.evidence[0];s.meta.idCounters.attachment=0;const a={id:'ATT-001',evidenceId:e.id,name:'photo.png',mimeType:'image/png',size:12,dataUrl:'data:image/png;base64,AA==',updatedAt:'now',savedWithoutContent:false};s.integrity.attachments=[a];e.attachmentId=a.id;return getObjectById('Attachment','ATT-001',s).evidenceId===e.id&&e.attachmentId==='ATT-001'});
  test('clear state has ten unknown coverage scopes',()=>{const s=createEmptyV31State();return s.integrity.containmentCoverage.length===10&&s.integrity.containmentCoverage.every(c=>c.applicability==='Unknown')});
  test('manual sorting containment can add DR data shape',()=>{const s=clone(state);const saved=state;state=s;const id=nextStableId('containment');state.integrity.containments.push({id,methodType:'Manual Sorting'});addDetectionReliability(id);const ok=state.integrity.detectionReliability.some(d=>d.containmentId===id&&d.methodType==='Manual Sorting');state=saved;return ok});
  test('planned containment blocks',()=>{const s=clone(state);s.integrity.containments[0].status='Planned';return validateContainmentIntegrity(s).status==='blocked'});
  test('missing containment implementationDate blocks',()=>{const s=clone(state);s.integrity.containments[0].implementationDate='';return validateContainmentIntegrity(s).status==='blocked'});
  test('escapeAfterContainment unknown blocks',()=>{const s=clone(state);s.integrity.detectionReliability[0].escapeAfterContainment='Unknown';return validateContainmentIntegrity(s).status==='blocked'});
  test('supported root cause without evidence blocks',()=>{const s=clone(state);const r=s.integrity.rootCauses[0];r.status='Supported';s.integrity.evidence=s.integrity.evidence.filter(e=>!((e.links||[]).some(l=>l.relatedType==='Root Cause'&&l.relatedId===r.id)));return validateRootCauseRecord(r,s).status==='blocked'});
  test('system NA missing approval blocks',()=>{const s=clone(state);const r=s.integrity.rootCauses.find(x=>x.type==='System');r.status='Not Applicable';r.notApplicableRationale='Controlled';r.approvedBy='';r.approvalDate='';return validateRootCauseRecord(r,s).status==='blocked'});
  test('system NA with approval warns',()=>{const s=clone(state);const r=s.integrity.rootCauses.find(x=>x.type==='System');r.status='Not Applicable';r.notApplicableRationale='Controlled';r.approvedBy='QA';r.approvalDate='2026-07-13';return validateRootCauseRecord(r,s).status==='warning'});
  test('strong action plus training passes occurrence coverage',()=>{const s=clone(state);const a=clone(s.integrity.correctiveActions[0]);a.id='CA-T02';a.actionType='Training';a.rootCauseIds=['RC-001'];s.integrity.correctiveActions.push(a);return !validateActionIntegrity(s).issues.some(i=>i.code==='CA_OCC_STRENGTH'&&i.objectId==='RC-001')});
  test('occurrence only training blocks',()=>{const s=clone(state);s.integrity.correctiveActions=s.integrity.correctiveActions.filter(a=>!(a.rootCauseIds||[]).includes('RC-001'));const a=clone(state.integrity.correctiveActions[0]);a.id='CA-T03';a.actionType='Training';a.rootCauseIds=['RC-001'];s.integrity.correctiveActions.push(a);return validateActionIntegrity(s).issues.some(i=>i.code==='CA_OCC_STRENGTH')});
  test('escape process parameter only blocks',()=>{const s=clone(state);s.integrity.correctiveActions=s.integrity.correctiveActions.filter(a=>!(a.rootCauseIds||[]).includes('RC-002'));const a=clone(state.integrity.correctiveActions[0]);a.id='CA-E01';a.rootCauseIds=['RC-002'];a.actionType='Process Parameter Control';a.description='Process setting';a.actionMechanism='Process control';s.integrity.correctiveActions.push(a);return validateActionIntegrity(s).issues.some(i=>i.code==='CA_ESC_DETECTION')});
  test('escape automated detection passes',()=>!validateActionIntegrity(state).issues.some(i=>i.code==='CA_ESC_DETECTION'));
  test('recurrence unknown blocks verification',()=>{const s=clone(state);s.integrity.verifications[0].recurrenceFound='Unknown';return validateVerificationRecord(s.integrity.verifications[0],s).status==='blocked'});
  test('open escape unknown blocks verification',()=>{const s=clone(state);s.integrity.verifications[0].openEscape='Unknown';return validateVerificationRecord(s.integrity.verifications[0],s).status==='blocked'});
  test('external submission complete reaches customer ready',()=>buildGateResult(state).finalStatus==='Ready for Customer Submission');
  test('language switch keeps modified RC and ID',()=>{state.integrity.rootCauses[0].hypothesis='USER EDIT';const id=state.integrity.rootCauses[0].id;state.lang=state.lang==='en'?'zh':'en';return state.integrity.rootCauses[0].hypothesis==='USER EDIT'&&state.integrity.rootCauses[0].id===id});
  test('new integrity action appears in report D5 HTML',()=>{const a=clone(state.integrity.correctiveActions[0]);a.id='CA-RPT';a.description='Report marker action';state.integrity.correctiveActions.push(a);return actionMainHTML(defaultReportOptions()).includes('Report marker action')});
  test('internal only evidence hidden from external package list',()=>{const s=clone(state);const e=s.integrity.evidence.find(x=>x.visibility==='Internal Only');return !!e&&!(s.integrity.evidence.filter(x=>x.visibility==='External').map(x=>x.id).includes(e.id))});
  test('complete created integrity can reach internal closure',()=>{const s=makeSelfTestState();s.externalSubmission={reviewed:false,reviewedBy:'',reviewDate:'',customerFacingConclusionApproved:false,openDisclosureReviewed:false};return buildGateResult(s).finalStatus==='Ready for Internal Closure'});
 }finally{
  state=original;
 }
 const passed=results.filter(r=>r.pass).length;
 const failed=results.length-passed;
 const summary={passed,failed,total:results.length,results};
 console.table(results);
 console.log('v31 integrity self tests:',summary);
 return summary;
}
qsa('.tab').forEach(btn=>btn.onclick=()=>activateTab(btn.dataset.tab));
state.fields.date=today(); renderAll();
</script>
<script>
window.QualityCopilotConfig = {
  currentTool: "guided_8d_investigation",
  analysisButtonTarget: ".reportPane .bd",
  insertButtonAfter: false,
  language: () => state.lang === "en" ? "en" : "zh",
  quickQuestions: {
    zh: [
      "解释我当前的 8D 状态",
      "下一步应该调查什么？",
      "当前步骤还缺什么证据？",
      "如何区分发生原因、流出原因和系统原因？",
      "帮我起草供应商跟进问题"
    ],
    en: [
      "Explain my current 8D status",
      "What should I investigate next?",
      "What evidence is missing at the current step?",
      "How do occurrence, escape, and system causes differ?",
      "Help me draft supplier follow-up questions"
    ]
  },
  requiresPageContext: question => {
    const text = String(question || "").toLowerCase();
    return /当前|这个|这份|页面|报告|结果|我的|下一步|缺什么|缺少|证据缺口|能否进入|是否可以进入|是否可以关闭|状态|解释我|\bgate\b|\bcurrent\b|\bmy\s+8d\b|\bnext step\b|\bmissing evidence\b|\bready to (?:proceed|close)\b/.test(text);
  },
  collectSummary: () => {
    if (typeof syncFromDom === "function") syncFromDom();
    if (typeof ensureV31State === "function") ensureV31State();
    const tab = typeof activeTabId === "function" ? activeTabId() : "intake";
    const stepMap = { intake: "INTAKE", risk: "INTAKE", timeline: "INTAKE", gate: "GATE", settings: "GATE" };
    const currentStep = stepMap[tab] || (/^d[0-8]$/i.test(tab) ? tab.toUpperCase() : "INTAKE");
    const integrity = state.integrity || {};
    const evidence = Array.isArray(integrity.evidence) ? integrity.evidence : [];
    const containments = Array.isArray(integrity.containments) ? integrity.containments : [];
    const causes = Array.isArray(integrity.rootCauses) ? integrity.rootCauses : [];
    const actions = Array.isArray(integrity.correctiveActions) ? integrity.correctiveActions : [];
    const verifications = Array.isArray(integrity.verifications) ? integrity.verifications : [];
    let gate = { finalStatus: "Unavailable", blocks: {} };
    let risk = {};
    try { gate = buildGateResult(); } catch {}
    try { risk = riskCalc(); } catch {}
    const issues = Object.values(gate.blocks || {}).flatMap(block =>
      Array.isArray(block?.issues) ? block.issues : []
    );
    const issueMessages = issues.slice(0, 10).map(issue => {
      try { return typeof msg === "function" ? msg(issue) : String(issue?.message || issue?.code || ""); }
      catch { return String(issue?.message || issue?.code || ""); }
    }).filter(Boolean);
    const countCause = (type, status) => causes.filter(item =>
      String(item?.type || "").toLowerCase() === type.toLowerCase()
      && (!status || String(item?.status || "").toLowerCase() === status.toLowerCase())
    ).length;
    const zh = state.lang !== "en";
    const summaryMetrics = zh ? {
      "当前 8D 步骤": currentStep,
      "Gate 状态": String(gate.finalStatus || "Unavailable"),
      "Gate 未关闭问题": String(issues.length),
      "风险优先级": String(risk?.p || ""),
      "风险评分": String(risk?.score ?? ""),
      "证据记录数": String(evidence.length),
      "遏制措施记录数": String(containments.length),
      "已确认发生原因": String(countCause("Occurrence", "Confirmed")),
      "已确认流出原因": String(countCause("Escape", "Confirmed")),
      "已确认系统原因": String(countCause("System", "Confirmed")),
      "纠正措施数": String(actions.length),
      "有效性验证数": String(verifications.length)
    } : {
      "current 8D step": currentStep,
      "Gate status": String(gate.finalStatus || "Unavailable"),
      "open Gate issues": String(issues.length),
      "risk priority": String(risk?.p || ""),
      "risk score": String(risk?.score ?? ""),
      "evidence records": String(evidence.length),
      "containment records": String(containments.length),
      "occurrence causes confirmed": String(countCause("Occurrence", "Confirmed")),
      "escape causes confirmed": String(countCause("Escape", "Confirmed")),
      "system causes confirmed": String(countCause("System", "Confirmed")),
      "corrective actions": String(actions.length),
      "effectiveness verifications": String(verifications.length)
    };
    return {
      current_tool: "guided_8d_investigation",
      analysis_type: `8D Problem Solving - ${currentStep}`,
      available_context: zh ? [
        "当前 8D 步骤",
        "Gate 状态和问题数",
        "风险优先级和评分",
        "证据记录数",
        "遏制措施记录数",
        "已确认的发生、流出和系统原因数量",
        "纠正措施数",
        "有效性验证数"
      ] : [
        "current 8D step",
        "Gate status and issue count",
        "risk priority and score",
        "evidence record count",
        "containment record count",
        "confirmed occurrence, escape, and system cause counts",
        "corrective action count",
        "effectiveness verification count"
      ],
      summary_metrics: summaryMetrics,
      deterministic_interpretation: issueMessages.length
        ? `${String(gate.finalStatus || "")}. ${issueMessages.join(" ")}`
        : String(gate.finalStatus || ""),
      has_results: true
    };
  }
};
</script>
